name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p public-dist
          rsync -a ./ public-dist/ \
            --exclude 'public-dist' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dockerignore' \
            --exclude '.nojekyll' \
            --exclude 'cloud-run' \
            --exclude 'scripts' \
            --exclude 'Dockerfile' \
            --exclude '*.md'

      - name: Normalize Cloudflare routes and metadata
        run: python3 scripts/prepare-cloudflare-site.py public-dist

      - name: Build browser-compatible provider video
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          ffmpeg -y \
            -i public-dist/assets/video/introduction.mov \
            -c:v libx264 \
            -preset medium \
            -crf 23 \
            -pix_fmt yuv420p \
            -c:a aac \
            -b:a 128k \
            -movflags +faststart \
            public-dist/assets/video/provider-introduction.mp4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME" || { echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || { echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          CLOUDFLARE_ACCOUNT_ID_CLEAN="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          case "$CLOUDFLARE_ACCOUNT_ID_CLEAN" in
            ''|*[!A-Za-z0-9_-]*)
              echo "CLOUDFLARE_ACCOUNT_ID contains invalid characters after whitespace normalization."
              exit 1
              ;;
          esac

          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_CLEAN" >> "$GITHUB_ENV"
          echo "Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          npx --yes wrangler@latest pages deploy public-dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main

      - name: Verify Cloudflare staging routes
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
        run: |
          bash scripts/verify-production-routes.sh \
            "https://${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev" \
            preview
