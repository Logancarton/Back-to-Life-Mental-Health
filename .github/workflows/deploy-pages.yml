name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install production image optimizer
        run: python3 -m pip install --disable-pip-version-check Pillow==11.3.0

      - name: Prepare static site
        run: |
          mkdir -p public-dist
          rsync -a ./ public-dist/ \
            --exclude 'public-dist' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dockerignore' \
            --exclude '.nojekyll' \
            --exclude 'cloud-run' \
            --exclude 'scripts' \
            --exclude 'Dockerfile' \
            --exclude '*.md'

      - name: Optimize assets, routes, and metadata
        run: python3 scripts/prepare-cloudflare-site.py public-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate Cloudflare configuration
        env:
          CLOUDFLARE_PAGES_PROJECT_NAME_RAW: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$CLOUDFLARE_PAGES_PROJECT_NAME_RAW" || { echo "Missing repository variable: CLOUDFLARE_PAGES_PROJECT_NAME"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing repository secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID_RAW" || { echo "Missing repository secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

          CLOUDFLARE_ACCOUNT_ID_CLEAN="$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID_RAW" | tr -d '[:space:]')"
          case "$CLOUDFLARE_ACCOUNT_ID_CLEAN" in
            ''|*[!A-Za-z0-9_-]*)
              echo "CLOUDFLARE_ACCOUNT_ID contains invalid characters after whitespace normalization."
              exit 1
              ;;
          esac

          CLOUDFLARE_PAGES_PROJECT_NAME_CLEAN="$(printf '%s' "$CLOUDFLARE_PAGES_PROJECT_NAME_RAW" | tr -d '[:space:]')"
          case "$CLOUDFLARE_PAGES_PROJECT_NAME_CLEAN" in
            ''|*[!A-Za-z0-9_-]*)
              echo "CLOUDFLARE_PAGES_PROJECT_NAME contains invalid characters after whitespace normalization."
              exit 1
              ;;
          esac

          echo "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID_CLEAN" >> "$GITHUB_ENV"
          echo "CLOUDFLARE_PAGES_PROJECT_NAME=$CLOUDFLARE_PAGES_PROJECT_NAME_CLEAN" >> "$GITHUB_ENV"
          echo "Cloudflare Pages project: $CLOUDFLARE_PAGES_PROJECT_NAME_CLEAN"

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          npx --yes wrangler@latest pages deploy public-dist \
            --project-name "$CLOUDFLARE_PAGES_PROJECT_NAME" \
            --branch main

      - name: Verify Cloudflare staging routes
        run: |
          bash scripts/verify-production-routes.sh \
            "https://${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev" \
            preview

      - name: Install Chromium for Task 2 acceptance
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium

      - name: Verify Task 2 rendered staging
        run: |
          node scripts/verify-browser-staging.mjs \
            "https://${CLOUDFLARE_PAGES_PROJECT_NAME}.pages.dev"
