name: Deploy website to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Prepare static site
        run: |
          mkdir -p public-dist
          rsync -a ./ public-dist/ \
            --exclude 'public-dist' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.dockerignore' \
            --exclude '.nojekyll' \
            --exclude 'cloud-run' \
            --exclude 'scripts' \
            --exclude 'Dockerfile' \
            --exclude '*.md'

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public-dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }} --branch=main
