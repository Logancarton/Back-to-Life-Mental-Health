name: Prepare primary Pages custom domain

on:
  push:
    branches:
      - main

permissions:
  contents: read
  statuses: write

jobs:
  prepare:
    if: contains(github.event.head_commit.message, 'Prepare primary Pages custom domain')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
      GITHUB_SHA: ${{ github.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID_RAW: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_PAGES_PROJECT_NAME_RAW: ${{ vars.CLOUDFLARE_PAGES_PROJECT_NAME }}
      PRIMARY_HOST: www.back-to-life-mental-health.com
    steps:
      - name: Attach primary hostname to Pages without changing DNS
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request

          token = os.environ.get('CLOUDFLARE_API_TOKEN', '').strip()
          account = os.environ.get('CLOUDFLARE_ACCOUNT_ID_RAW', '').strip()
          project = os.environ.get('CLOUDFLARE_PAGES_PROJECT_NAME_RAW', '').strip()
          host = os.environ['PRIMARY_HOST'].strip().lower()
          gh_token = os.environ['GH_TOKEN']
          repo = os.environ['GITHUB_REPOSITORY']
          sha = os.environ['GITHUB_SHA']

          def publish(state, context, description):
              req = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/statuses/{sha}',
                  data=json.dumps({'state': state, 'context': context, 'description': description[:140]}).encode(),
                  method='POST',
                  headers={
                      'Accept': 'application/vnd.github+json',
                      'Authorization': f'Bearer {gh_token}',
                      'X-GitHub-Api-Version': '2022-11-28',
                      'Content-Type': 'application/json',
                  },
              )
              with urllib.request.urlopen(req, timeout=20):
                  pass

          def cf(method, path, payload=None):
              req = urllib.request.Request(
                  f'https://api.cloudflare.com/client/v4{path}',
                  data=None if payload is None else json.dumps(payload).encode(),
                  method=method,
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      body = json.load(response)
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode('utf-8', 'replace')
                  raise RuntimeError(f'HTTP {exc.code}: {raw[:600]}') from exc
              if not body.get('success'):
                  raise RuntimeError(str(body.get('errors')))
              return body.get('result')

          if not token or not account or not project:
              publish('failure', 'pages-primary-domain-config-missing', 'Required Cloudflare configuration is missing')
              raise SystemExit(1)

          quoted_project = urllib.parse.quote(project, safe='')
          quoted_host = urllib.parse.quote(host, safe='')
          domain_path = f'/accounts/{account}/pages/projects/{quoted_project}/domains/{quoted_host}'
          domains_path = f'/accounts/{account}/pages/projects/{quoted_project}/domains'

          existing = None
          try:
              existing = cf('GET', domain_path)
          except RuntimeError as exc:
              if 'HTTP 404' not in str(exc):
                  publish('failure', 'pages-primary-domain-api-error', str(exc))
                  raise SystemExit(1)

          if existing:
              status = existing.get('status', 'unknown') if isinstance(existing, dict) else 'unknown'
              publish('success', 'pages-primary-domain-attached', f'Primary hostname already attached; status={status}')
              print(json.dumps(existing, indent=2))
              raise SystemExit(0)

          try:
              result = cf('POST', domains_path, {'name': host})
          except Exception as exc:
              publish('failure', 'pages-primary-domain-add-failed', str(exc))
              raise SystemExit(1)

          status = result.get('status', 'unknown') if isinstance(result, dict) else 'unknown'
          publish('success', 'pages-primary-domain-attached', f'Primary hostname attached; status={status}; DNS unchanged')
          print(json.dumps(result, indent=2))
          PY
