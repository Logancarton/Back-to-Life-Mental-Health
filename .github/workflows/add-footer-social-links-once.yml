name: Add footer social links once

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-footer-social-links-once.yml

permissions:
  contents: write

jobs:
  add-footer-social-links:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Patch footer links only
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -Fc "const facebookUrl = 'https://www.facebook.com/profile.php?id=61552499436523';" script.js)" -eq 1
          test "$(grep -Fc "contactColumn.appendChild(facebookLink);" script.js)" -eq 1
          ! grep -Fq "const instagramUrl =" script.js
          ! grep -Fq "const linkedinCompanyUrl =" script.js

          sed -i "/const facebookUrl = 'https:\/\/www.facebook.com\/profile.php?id=61552499436523';/a\\
          const instagramUrl = 'https://www.instagram.com/backtolifementalhealth/';\\
          const linkedinCompanyUrl = 'https://www.linkedin.com/company/103752686/';" script.js

          sed -i "/contactColumn.appendChild(facebookLink);/a\\
          \\
          \\  if (!contactColumn.querySelector('[data-instagram-link]')) {\\
          \\    const instagramLink = document.createElement('a');\\
          \\    instagramLink.href = instagramUrl;\\
          \\    instagramLink.target = '_blank';\\
          \\    instagramLink.rel = 'noopener noreferrer';\\
          \\    instagramLink.textContent = 'Instagram';\\
          \\    instagramLink.setAttribute('data-instagram-link', '');\\
          \\    contactColumn.appendChild(instagramLink);\\
          \\  }\\
          \\
          \\  if (!contactColumn.querySelector('[data-linkedin-company-link]')) {\\
          \\    const linkedinLink = document.createElement('a');\\
          \\    linkedinLink.href = linkedinCompanyUrl;\\
          \\    linkedinLink.target = '_blank';\\
          \\    linkedinLink.rel = 'noopener noreferrer';\\
          \\    linkedinLink.textContent = 'LinkedIn';\\
          \\    linkedinLink.setAttribute('data-linkedin-company-link', '');\\
          \\    contactColumn.appendChild(linkedinLink);\\
          \\  }" script.js

          git diff --check

      - name: Commit only script.js
        run: |
          git config user.name "Logancarton"
          git config user.email "logan_1928@msn.com"
          git add script.js
          test "$(git diff --cached --name-only)" = "script.js"
          git commit -m "Add Instagram and LinkedIn footer links"
          git push
